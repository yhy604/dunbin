<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>你有一份神秘礼物</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --glow: rgba(255, 200, 255, .6);
    --accent: #ffd6e8;
  }

  body {
    min-height: 100vh;
    background: radial-gradient(circle at 50% 30%, #2b1d3a, #12091c 70%);
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #fff;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ===== 开场 ===== */
  .intro { text-align: center; transition: opacity .8s ease; padding: 0 20px; }

  .festival-tag {
    display: inline-block;
    margin-bottom: 18px;
    padding: 6px 18px;
    font-size: 14px;
    letter-spacing: 1px;
    border-radius: 999px;
    color: var(--accent);
    background: rgba(255, 255, 255, .07);
    border: 1px solid rgba(255, 255, 255, .16);
    animation: fadeUp .9s ease both;
  }

  .intro h1 {
    font-size: clamp(22px, 5vw, 40px);
    letter-spacing: 2px;
    margin-bottom: 14px;
    text-shadow: 0 0 24px var(--glow);
    animation: fadeUp .9s ease .08s both;
  }
  .intro h1 .hl {
    color: var(--accent);
    text-shadow: 0 0 28px currentColor;
  }

  .subtitle {
    min-height: 22px;
    margin-bottom: 32px;
    font-size: 15px;
    letter-spacing: 1px;
    color: rgba(255, 255, 255, .68);
    animation: fadeUp .9s ease .16s both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .btn {
    padding: 14px 46px;
    font-size: 18px;
    font-weight: 700;
    color: #2b1030;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    background: linear-gradient(135deg, #ff9ecb, #a78bfa);
    box-shadow: 0 0 30px rgba(255, 158, 203, .5);
    transition: transform .2s, box-shadow .2s;
  }
  .btn:hover  { transform: scale(1.06); box-shadow: 0 0 48px rgba(255, 158, 203, .85); }
  .btn:active { transform: scale(.96); }

  /* ===== 提示语舞台 ===== */
  #stage {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
  }

  .tip {
    position: absolute;
    max-width: 70vw;
    text-align: center;
    padding: 10px 18px;
    border-radius: 16px;
    background: rgba(255, 255, 255, .08);
    border: 1px solid rgba(255, 255, 255, .16);
    backdrop-filter: blur(4px);
    opacity: 0;
    animation: floatUp 4s ease-out forwards;
  }

  @keyframes floatUp {
    0% {
      opacity: 0;
      transform: translate(-50%, 24px) scale(.6) rotate(var(--rot));
    }
    15% {
      opacity: 1;
      transform: translate(-50%, 0) scale(1) rotate(var(--rot));
    }
    70% { opacity: 1; }
    100% {
      opacity: 0;
      transform: translate(calc(-50% + var(--tx)), -150px) scale(.9) rotate(var(--rot));
    }
  }

  /* ===== 结尾：I love you ===== */
  .final-tip {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    opacity: 0;
    animation: finalIn 1.1s ease forwards;
  }
  .final-tip span {
    display: inline-block;
    font-size: clamp(30px, 8vw, 64px);
    font-weight: 800;
    letter-spacing: 1px;
    color: #fff;
    text-shadow:
      0 0 20px rgba(255, 120, 180, .95),
      0 0 48px rgba(200, 120, 255, .75),
      0 0 90px rgba(255, 120, 180, .45);
    animation: heartbeat 1.7s ease-in-out 1.1s infinite;
  }

  @keyframes finalIn {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(.55); }
    60%  { opacity: 1; transform: translate(-50%, -50%) scale(1.06); }
    100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  }

  @keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.09); }
  }
</style>
</head>
<body>

  <div class="intro" id="intro">
    <div class="festival-tag" id="festivalTag" style="display:none"></div>
    <h1 id="mainTitle">你有一份神秘礼物 🎁</h1>
    <p class="subtitle" id="subtitle"></p>
    <button class="btn" id="startBtn">点我拆开</button>
  </div>

  <div id="stage"></div>

<script>
  /* ==================================================
     一、节日数据
     ================================================== */

  /* 公历固定节日：按「月-日」匹配，每年重复 */
  const SOLAR_FESTIVALS = {
    "1-1":   { name: "元旦",       word: "新年",     emoji: "🎊", color: "#ffd166", sub: "新年快乐，万事顺遂" },
    "2-14":  { name: "情人节",     word: "情人节",   emoji: "💝", color: "#ff8fb1", sub: "Be my Valentine" },
    "3-8":   { name: "妇女节",     word: "女神节",   emoji: "🌷", color: "#ffa8c5", sub: "做自己的女王" },
    "3-14":  { name: "白色情人节", word: "白色情人节", emoji: "🤍", color: "#e8e0ff", sub: "白色浪漫，如期而至" },
    "4-1":   { name: "愚人节",     word: "愚人节",   emoji: "🃏", color: "#a8d8ff", sub: "今天说的谎，都算数" },
    "5-1":   { name: "劳动节",     word: "劳动节",   emoji: "🛠", color: "#ffb37b", sub: "辛苦了，好好休息" },
    "5-4":   { name: "青年节",     word: "青年节",   emoji: "🔥", color: "#ff9a76", sub: "永远年轻，永远热泪盈眶" },
    "5-20":  { name: "520",        word: "520",      emoji: "💗", color: "#ff8fb1", sub: "我爱你" },
    "5-21":  { name: "521",        word: "521",      emoji: "💗", color: "#ff8fb1", sub: "我爱你" },
    "6-1":   { name: "儿童节",     word: "儿童节",   emoji: "🍭", color: "#9be7c4", sub: "今天允许你当一天小孩" },
    "9-10":  { name: "教师节",     word: "教师节",   emoji: "📚", color: "#a8d8ff", sub: "谢谢你，老师" },
    "10-1":  { name: "国庆节",     word: "国庆",     emoji: "🎈", color: "#ff8a8a", sub: "举国同庆" },
    "10-31": { name: "万圣节",     word: "万圣节",   emoji: "🎃", color: "#ffb066", sub: "Trick or Treat" },
    "11-11": { name: "双十一",     word: "双十一",   emoji: "🛒", color: "#ffd166", sub: "今天也别忘了爱自己" },
    "12-24": { name: "平安夜",     word: "平安夜",   emoji: "🍎", color: "#ff9a9a", sub: "平安喜乐" },
    "12-25": { name: "圣诞节",     word: "圣诞",     emoji: "🎄", color: "#8fe3b0", sub: "Merry Christmas" }
  };

  /* 农历节日：每年公历日期不同，按「年-月-日」精确匹配 */
  const LUNAR_FESTIVALS = [
    { name: "除夕", word: "除夕", emoji: "🧧", color: "#ff7a7a", sub: "辞旧迎新，团圆守岁",
      dates: ["2024-2-9","2025-1-28","2026-2-16","2027-2-5","2028-1-25","2029-2-12","2030-2-2","2031-1-22","2032-2-10","2033-1-30","2034-2-18","2035-2-7"] },
    { name: "春节", word: "新春", emoji: "🧨", color: "#ff6b6b", sub: "新年快乐，万事顺遂",
      dates: ["2024-2-10","2025-1-29","2026-2-17","2027-2-6","2028-1-26","2029-2-13","2030-2-3","2031-1-23","2032-2-11","2033-1-31","2034-2-19","2035-2-8"] },
    { name: "元宵节", word: "元宵", emoji: "🏮", color: "#ffb066", sub: "月圆人圆，事事圆满",
      dates: ["2024-2-24","2025-2-12","2026-3-3","2027-2-20","2028-2-9","2029-2-27","2030-2-17","2031-2-6","2032-2-25","2033-2-14","2034-3-5","2035-2-22"] },
    { name: "端午节", word: "端午", emoji: "🐉", color: "#7ed6a5", sub: "端午安康",
      dates: ["2024-6-10","2025-5-31","2026-6-19","2027-6-9","2028-5-28","2029-6-16","2030-6-5","2031-6-24","2032-6-12","2033-6-1","2034-6-20","2035-6-10"] },
    { name: "七夕", word: "七夕", emoji: "🌌", color: "#c3a8ff", sub: "愿有情人终成眷属",
      dates: ["2024-8-10","2025-8-29","2026-8-19","2027-8-8","2028-8-26","2029-8-16","2030-8-5","2031-8-24","2032-8-12","2033-8-1","2034-8-20","2035-8-10"] },
    { name: "中秋节", word: "中秋", emoji: "🌕", color: "#ffe08a", sub: "但愿人长久，千里共婵娟",
      dates: ["2024-9-17","2025-10-6","2026-9-25","2027-9-15","2028-10-3","2029-9-22","2030-9-12","2031-10-1","2032-9-19","2033-9-8","2034-9-27","2035-9-16"] },
    { name: "重阳节", word: "重阳", emoji: "🍁", color: "#ffb37b", sub: "久久重阳，久久安康",
      dates: ["2024-10-11","2025-10-29","2026-10-18","2027-10-8","2028-10-26","2029-10-16","2030-10-5","2031-10-24","2032-10-12","2033-10-1","2034-10-20","2035-10-10"] }
  ];

  /* 把农历节日展开成 Map，方便 O(1) 查询 */
  const LUNAR_MAP = new Map();
  LUNAR_FESTIVALS.forEach(f => f.dates.forEach(d => LUNAR_MAP.set(d, f)));

  /* ==================================================
     二、日期与节日查询工具
     ================================================== */
  const dayKey      = d => `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
  const monthDayKey = d => `${d.getMonth() + 1}-${d.getDate()}`;

  function getFestival(d) {
    return LUNAR_MAP.get(dayKey(d)) || SOLAR_FESTIVALS[monthDayKey(d)] || null;
  }

  /* 往后找最近的节日，最多找 120 天 */
  function findUpcoming(from) {
    for (let i = 1; i <= 120; i++) {
      const d = new Date(from.getFullYear(), from.getMonth(), from.getDate() + i);
      const f = getFestival(d);
      if (f) return { festival: f, days: i };
    }
    return null;
  }

  function hexToRgba(hex, a) {
    const h = hex.replace("#", "");
    const r = parseInt(h.slice(0, 2), 16);
    const g = parseInt(h.slice(2, 4), 16);
    const b = parseInt(h.slice(4, 6), 16);
    return `rgba(${r},${g},${b},${a})`;
  }

  /* ==================================================
     三、确定「今天」——支持 ?preview=12-25 预览
     ================================================== */
  let today = new Date();

  const params = new URLSearchParams(location.search);
  const pv = params.get("preview");
  if (pv) {
    const p = pv.split("-").map(Number);
    if (p.length === 3 && p.every(n => !isNaN(n))) {
      today = new Date(p[0], p[1] - 1, p[2]);
    } else if (p.length === 2 && p.every(n => !isNaN(n))) {
      today = new Date(today.getFullYear(), p[0] - 1, p[1]);
    }
  }

  /* ==================================================
     四、渲染标题
     ================================================== */
  const intro        = document.getElementById("intro");
  const mainTitle    = document.getElementById("mainTitle");
  const festivalTag  = document.getElementById("festivalTag");
  const subtitle     = document.getElementById("subtitle");
  const startBtn     = document.getElementById("startBtn");
  const stage        = document.getElementById("stage");

  const todayFestival = getFestival(today);

  if (todayFestival) {
    const f = todayFestival;

    // 主题色注入
    document.documentElement.style.setProperty("--accent", f.color);
    document.documentElement.style.setProperty("--glow", hexToRgba(f.color, .75));

    // 节日标签
    festivalTag.style.display = "inline-block";
    festivalTag.textContent = `今天是 ${f.name} ${f.emoji}`;

    // 标题变化：你有一份【新春】神秘礼物 🧨
    mainTitle.innerHTML = `你有一份<span class="hl">${f.word}</span>神秘礼物 ${f.emoji}`;
    subtitle.textContent = f.sub;

    document.title = `你有一份${f.word}神秘礼物 ${f.emoji}`;
  } else {
    // 非节日：标题保持默认，副标题提示最近的节日
    const up = findUpcoming(today);
    if (up) {
      subtitle.textContent = `距离 ${up.festival.emoji} ${up.festival.name} 还有 ${up.days} 天`;
    } else {
      subtitle.textContent = "每一天，都值得被温柔对待";
    }
  }

  /* ==================================================
     五、提示语文案
     ================================================== */
  const TIPS = [
    "记得好好喝水 💧",
    "记得好好爱自己 🌸",
    "今天也要早点睡哦 🌙",
    "你值得被温柔对待 🫧",
    "别忘了吃早饭 🍞",
    "累了就休息一下 ☁️",
    "你已经很棒了 ✨",
    "多晒晒太阳吧 🌤",
    "想哭就哭，没关系的 🫂",
    "慢慢来，不着急 🐌",
    "别总说对不起 🙅",
    "今天也辛苦你了 🍵",
    "记得伸个懒腰 🧘",
    "你笑起来很好看 😊",
    "少熬夜，多抱抱自己 🛏",
    "天冷了记得加衣服 🧣",
    "难过的时候，允许自己难过 🌧",
    "你已经做得很好了 🌷",
    "偶尔摆烂也没关系 🛋",
    "多喝水，皮肤会感谢你 💦",
    "记得给自己买点好吃的 🍰",
    "别把自己逼得太紧 🕯",
    "今天的你也在努力呀 🌱",
    "深呼吸，一切都会好起来 🌈",
    "别忘记夸夸自己 🏅",
    "想见的人就去见吧 🚪",
    "喜欢的歌要大声听 🎧",
    "多抬头看看天空 ☁️",
    "你不需要完美才能被爱 💌",
    "深夜的胡思乱想不算数 🌌",
    "记得偶尔关掉手机 📵",
    "给妈妈打个电话吧 📞",
    "你已经很勇敢了 🦁",
    "愿你被世界温柔以待 🌻",
    "走得慢也是在往前走 🐾",
    "记得给自己留一点独处的时间 🕯",
    "今天的风也在为你加油 🍃",
    "好好吃饭，好好睡觉 🍚",
    "不用和别人比较，你有自己的节奏 🎵"
  ];

  const FINAL_TEXT = "I love you ❤️";
  const COLORS = ["#ffd6e8", "#d9c8ff", "#c8f0ff", "#fff3c4", "#d8ffd8", "#ffd9c0"];

  /* ==================================================
     六、播放逻辑
     ================================================== */
  let running = false;
  let shown   = 0;
  let ended   = false;
  let deck    = [];

  const TARGET = 18 + Math.floor(Math.random() * 10); // 本次随机提示条数

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }
  function nextTip() {
    if (!deck.length) deck = shuffle([...TIPS]);
    return deck.pop();
  }

  startBtn.addEventListener("click", () => {
    if (running) return;
    running = true;

    intro.style.opacity = "0";
    setTimeout(() => intro.remove(), 800);

    scheduleNext(300);
  });

  function scheduleNext(delay) {
    if (ended) return;

    setTimeout(() => {
      if (shown < TARGET) {
        spawnTip();
        shown++;
        scheduleNext(350 + Math.random() * 500);
      } else {
        ended = true;
        spawnFinal();
      }
    }, delay);
  }

  function spawnTip() {
    if (stage.childElementCount > 60) return;

    const el = document.createElement("div");
    el.className = "tip";
    el.textContent = nextTip();

    el.style.left = (15 + Math.random() * 70) + "%";
    el.style.top  = (20 + Math.random() * 65) + "%";

    el.style.fontSize = (15 + Math.random() * 13) + "px";
    el.style.color    = COLORS[Math.floor(Math.random() * COLORS.length)];

    el.style.setProperty("--rot", (Math.random() * 16 - 8) + "deg");
    el.style.setProperty("--tx",  (Math.random() * 90 - 45) + "px");

    el.style.animationDuration = (3.4 + Math.random() * 1.6) + "s";

    stage.appendChild(el);
    el.addEventListener("animationend", () => el.remove());
  }

  function spawnFinal() {
    setTimeout(() => {
      const wrap = document.createElement("div");
      wrap.className = "final-tip";
      const text = document.createElement("span");
      text.textContent = FINAL_TEXT;
      wrap.appendChild(text);
      stage.appendChild(wrap);
    }, 800);
  }
</script>
</body>
</html>
